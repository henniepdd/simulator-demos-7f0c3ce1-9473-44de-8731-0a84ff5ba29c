:root {
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", system-ui, "Segoe UI", Roboto, sans-serif;
  --ios-blue: #0A7CFF;
  --ios-green: #34C759;
  --bubble-in: #E9E9EB;
  --ios-grey-label: #8A8A8E;
  --ios-separator: rgba(60,60,67,0.20);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }

body {
  background: #1c1c1e;
  font-family: var(--sf);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 100vh;   /* fallback first */
  min-height: 100dvh;
  -webkit-user-select: none;
  user-select: none;
}

.device {
  position: relative;
  width: 100%;
  height: 100vh;       /* fallback first */
  height: 100dvh;
  overflow: hidden;
  background: #000;
}

/* Handset frame for desktop review only. The real phone is its own frame. */
@media (min-width: 480px) and (min-height: 720px) {
  .device {
    width: 390px;
    height: 844px;
    border-radius: 46px;
    box-shadow: 0 0 0 10px #0d0d0d, 0 0 0 12px #2a2a2c, 0 30px 70px rgba(0,0,0,0.6);
  }
}

.surface {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------------- Apple status bar ---------------- */

.apple-statusbar {
  flex: 0 0 auto;
  height: 54px;
  padding: 0 30px 0 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 600;
}
.apple-statusbar .sb-time { min-width: 54px; }
.apple-statusbar .sb-icons { display: flex; align-items: center; gap: 6px; }
.apple-statusbar svg { display: block; }

/* ---------------- Apple lock screen ---------------- */

.apple-lock { color: #fff; }
.apple-wallpaper {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 80% at 18% 8%,  #4b2a63 0%, rgba(75,42,99,0) 58%),
    radial-gradient(110% 70% at 88% 26%, #1c5a53 0%, rgba(28,90,83,0) 62%),
    radial-gradient(130% 90% at 50% 108%, #2a1c3a 0%, rgba(42,28,58,0) 60%),
    linear-gradient(168deg, #241a35 0%, #14131c 52%, #0b0c11 100%);
}
/* A second wallpaper for the side story: same depth so the white
   clock still reads, but a clearly different phone, so the change
   of person registers before anyone reads a word. */
.apple-wallpaper.warm {
  background:
    radial-gradient(120% 80% at 18% 8%,  #1f6b4a 0%, rgba(31,107,74,0) 58%),
    radial-gradient(110% 70% at 88% 26%, #5c8a2f 0%, rgba(92,138,47,0) 62%),
    radial-gradient(130% 90% at 50% 108%, #123528 0%, rgba(18,53,40,0) 60%),
    linear-gradient(168deg, #16302a 0%, #101c18 52%, #080d0b 100%);
}
.apple-wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0) 30%);
}
.lock-body { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.lock-head { flex: 0 0 auto; text-align: center; }
.padlock { opacity: 0.92; margin-bottom: 14px; }
.lock-date { font-size: 21px; font-weight: 590; opacity: 0.94; margin: 0 0 -2px; }
.lock-stage {
  margin: 10px 0 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: #fff;
}

.lock-clock {
  font-size: 88px; font-weight: 590; letter-spacing: -2.5px;
  line-height: 1.02; margin: 0; font-variant-numeric: tabular-nums;
}
.lock-notifications {
  flex: 1 1 auto; display: flex; flex-direction: column;
  justify-content: flex-end; gap: 8px; padding: 0 10px 14px; min-height: 0;
}
.notification {
  display: flex; gap: 10px; width: 100%; text-align: left;
  color: #fff; padding: 12px 14px; border-radius: 20px;
  background: rgba(255,255,255,0.16);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.14);
  animation: notifIn 420ms cubic-bezier(0.22,1,0.36,1);
}
@keyframes notifIn {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.notif-icon { flex: 0 0 auto; width: 38px; height: 38px; }
.notif-main { flex: 1 1 auto; min-width: 0; display: block; }
.notif-meta {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 12px; letter-spacing: 0.35px; text-transform: uppercase;
  opacity: 0.72; margin-bottom: 1px;
}
@media (min-width: 400px) {
  .notif-body { -webkit-line-clamp: 4; }
}
.notif-title { display: block; font-size: 15px; font-weight: 600; margin: 0 0 1px; }
.notif-body {
  display: -webkit-box;
  -webkit-line-clamp: 5;   /* narrow phones need the extra line */
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 15px;
  line-height: 1.28;
  margin: 0;
  opacity: 0.94;
}
.notif-body .notif-link { text-decoration: underline; text-underline-offset: 2px; }
button.notification {
  border: 0;
  font-family: var(--sf);
  text-align: left;
  cursor: pointer;
  transition: transform 140ms ease, background 140ms ease;
}
button.notification:active { transform: scale(0.975); background: rgba(255,255,255,0.24); }
.lock-foot {
  flex: 0 0 auto; display: flex; align-items: center;
  justify-content: space-between; padding: 0 44px 10px;
}
.lock-action {
  width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}

/* ---------------- home indicator ---------------- */

.home-indicator { flex: 0 0 auto; height: 22px; display: grid; place-items: center; }
.home-indicator i { display: block; width: 140px; height: 5px; border-radius: 3px; background: currentColor; opacity: 0.9; }
.apple-lock .home-indicator { color: #fff; }

/* Review-only screen number. Sits above the handset on desktop and is
   absent on a phone, where the device fills the viewport. */
.stage-wrap {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.step-number {
  display: none;
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: rgba(255,255,255,0.55);
}
.step-number b { color: rgba(255,255,255,0.92); font-weight: 600; }
@media (min-width: 480px) and (min-height: 720px) {
  .step-number { display: block; }
}

/* A visible error reporter. If the script fails in a browser the page
   would otherwise just sit there black, which tells us nothing. */
.boot-error {
  position: fixed;
  inset: 0;
  z-index: 999;
  overflow: auto;
  padding: 24px;
  background: #1c1c1e;
  color: #ffb4b4;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.boot-error b { color: #fff; display: block; margin-bottom: 10px; font-size: 15px; }

.nav-pills {
  position: absolute;
  z-index: 22;
  right: 14px;
  bottom: calc(30px + env(safe-area-inset-bottom, 0px));
  display: flex;
}
.nav-pill {
  display: none;            /* shown only on a beat, via .show */
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 0 18px;
  border: 0;
  border-radius: 999px;
  font-family: var(--sf);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
}
.device.tone-dark .nav-pill { background: rgba(255,255,255,0.22); color: #fff; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.2); }
.device.tone-light .nav-pill { background: rgba(17,17,17,0.82); color: #fff; }
.nav-pill.show { display: flex; }
.nav-pill:active { transform: scale(0.96); }

/* ==================================================================
   VISION ZONE — DrDoctor patient portal (pp vision).
   Nothing below is Apple. Tokens from the PP components page.
   RM Neue Regular and Bold are embedded above as subset woff.
   PolySans Bulky is not, since no screen uses the Title 30 style yet.
   ================================================================== */

.vision {
  --v-blue: #0060B6;
  --v-blue-soft: #E5EFF8;
  --v-cream: #F9F8F6;
  --v-black: #0D0D0D;
  --v-grey: #ECECEC;
  --v-cream: #F9F8F6;
  --v-text-grey: #767676;   /* (Vision) Text grey, 4.54:1 on white */
  --v-sans: "RM Neue", "Helvetica Neue", Helvetica, Arial, sans-serif;

  background: var(--v-cream);
  color: var(--v-black);
  font-family: var(--v-sans);
  padding-left: 16px;
  padding-right: 16px;
}
.vision .apple-statusbar { color: var(--v-black); padding: 0 14px 0 18px; }


.v-main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-top: 12px;
  min-height: 0;
  overflow-y: auto;
}

/* --- Action bar (624:990) --- */
.v-actionbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.v-actionbar h1 {
  flex: 1 1 auto;
  margin: 0;
  font-size: 25px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.2px;
}
.v-actionbar .v-back { flex: 1 1 auto; padding-top: 0; }
.v-btngroup {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  min-width: 0;
  height: 34px;
  border-radius: 20px;
  background: var(--v-grey);
}
.v-btngroup span[data-tab] { cursor: pointer; }
.v-btngroup span {
  flex: 1 1 0;
  min-width: 0;
  display: grid;
  place-items: center;
  height: 34px;
  padding: 0 14px;
  margin-right: -1px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.2;
  white-space: nowrap;
}
.v-btngroup span.on { background: #fff; }

/* --- Empty state (651:315). Same shape as the Confirmation screen,
       grey circle rather than green. --- */
.v-empty { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.v-flush { display: flex; flex-direction: column; gap: 0; }
.v-empty-mark {
  align-self: center;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: var(--v-grey);
  color: var(--v-black);
  display: grid;
  place-items: center;
}
.v-empty-text { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.v-empty-text h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.2; }
.v-empty-text p { margin: 0; font-size: 12px; font-weight: 400; line-height: 1.2; color: var(--v-text-grey); }

.v-actionbar-settings { flex: 0 0 auto; display: grid; place-items: center; color: var(--v-black); }

.v-iconbtn {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 10px;
  color: var(--v-black);
}
.v-iconbtn.white { width: 44px; height: 44px; background: #fff; }
.v-iconbtn.clear { width: 48px; height: 48px; background: transparent; }
.v-iconbtn.current { width: 48px; height: 48px; background: var(--v-blue); color: #fff; }

.v-section { display: flex; flex-direction: column; gap: 8px; }
.v-section h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
}

/* --- Card (pp vision, 621:697) --- */
.v-card[data-goto] { cursor: pointer; }
.v-card[data-goto]:active { opacity: 0.7; }

.v-card {
  display: flex;
  border-radius: 8px;
  overflow: hidden;
}
.v-card-stripe { flex: 0 0 6px; background: #fff; }
.v-card.unread .v-card-stripe { background: var(--v-blue); }
.v-card-body {
  flex: 1 1 auto;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 18px 18px 18px 12px;
  background: #fff;
  min-width: 0;
}
.v-card.compact .v-card-body { padding: 14px 18px 14px 12px; }
.v-card-badge {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  margin-top: 2px;
  border-radius: 50%;
  background: rgba(0, 96, 182, 0.2);
  color: #fff;
  display: grid;
  place-items: center;
}
.v-card-text { flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.v-card-titlerow { display: flex; align-items: center; gap: 4px; }
.v-card-titlerow b { flex: 1 1 auto; min-width: 0; }
.v-card-titlerow .v-tag { flex: 0 0 auto; margin-left: auto; }
.v-card-text b { font-size: 14px; font-weight: 600; line-height: 1.2; }
.v-card-sub { font-size: 12px; font-weight: 400; line-height: 1.17; color: var(--v-text-grey); }

.v-older[data-goto] { cursor: pointer; }
.v-older[data-goto]:active { opacity: 0.6; }

.v-older {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 400;
  line-height: 1.2;
  color: var(--v-text-grey);
}
.v-older svg { margin-left: 3px; }
/* --- Appointment card (552:395) --- */
.v-appt {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 20px;
  border-radius: 6px;
  background: var(--v-blue-soft);
}
.v-appt.past { background: var(--v-grey); }
.v-appt.past .v-appt-main { border-bottom-color: #D3D2D2; }
.v-appt-main {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 8px;
  border-bottom: 1px solid #CCDFF0;
}
.v-appt-label { font-size: 10px; font-weight: 400; line-height: 1.2; color: var(--v-text-grey); }
.v-appt-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.v-appt-when { font-size: 18px; font-weight: 600; line-height: 1.2; }
.v-appt-time { flex: 0 0 auto; font-size: 18px; font-weight: 600; line-height: 1.2; }
.v-appt-where { display: flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 400; line-height: 1.2; }

/* --- Status card (Intro home, 4140:14648) --- */
.v-status {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 20px;
  border-radius: 6px;
  background: var(--v-grey);
}
.v-status-row { display: flex; align-items: center; gap: 8px; }
.v-status-row b { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.2; }
.v-status-row .v-tag { flex: 0 0 auto; margin-left: auto; }
.v-status p { margin: 0; font-size: 12px; font-weight: 400; line-height: 1.17; color: var(--v-text-grey); }

/* --- Section heading with a count --- */
.v-section-head { display: flex; align-items: center; gap: 4px; }
.v-tag.v-count {
  min-width: 16px;
  height: 16px;
  padding: 2px;
  border-radius: 50%;
  font-size: 10px;
  justify-content: center;
}

/* --- Tag --- */
.v-tag {
  display: inline-flex;
  align-self: flex-start;
  align-items: center;
  gap: 2px;
  padding: 2px 4px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.2;
  white-space: nowrap;
}
.v-tag.dark    { background: var(--v-blue); color: #fff; }
.v-tag.white   { background: #fff;          color: var(--v-black); }
.v-tag.outline { background: none;         color: var(--v-text-grey); box-shadow: inset 0 0 0 1px var(--v-grey); }
.v-tag.grey    { background: var(--v-grey);  color: var(--v-black); }
.v-tag.warning { background: #FFEBD5;        color: var(--v-black); }
.v-tag.error   { background: #F7DDDA;        color: var(--v-black); }
.v-tag.success { background: #D2E7D9;        color: var(--v-black); }

/* --- Form screens --- */
.v-form-head { display: flex; flex-direction: column; gap: 12px; }
.v-back[data-goto] { cursor: pointer; }
.v-back[data-goto]:active { opacity: 0.6; }

.v-back {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-top: 8px;   /* mine, for spacing; layouts will replace it */
  border: 0;
  background: none;
  font-family: var(--v-sans);
  font-size: 12px;
  line-height: 1.2;
  color: var(--v-black);
}
.v-titleblock { display: flex; flex-direction: column; gap: 4px; }
.v-titleblock h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2; }
.v-titleblock p { margin: 0; font-size: 12px; font-weight: 400; line-height: 1.2; color: var(--v-text-grey); }

.v-progress { height: 9px; border-radius: 4px; background: #D9D9D9; overflow: hidden; }
.v-progress i {
  display: block;
  height: 100%;
  border-radius: 4px;
  background: var(--v-blue);
  transition: width 320ms cubic-bezier(0.22,1,0.36,1);
}

.v-qgroup { display: flex; flex-direction: column; gap: 12px; }
.v-qgroup > p { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.2; }
.v-qhint { font-weight: 400; color: var(--v-text-grey); }
.v-options { display: flex; flex-direction: column; gap: 12px; }

.v-select {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  min-height: 44px;
  padding: 12px 16px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  color: var(--v-black);
  font-family: var(--v-sans);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  text-align: left;
  cursor: pointer;
}
.v-select.selected { background: var(--v-blue); color: #fff; }

.v-radio {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--v-blue);
  display: grid;
  place-items: center;
}
.v-select.selected .v-radio { box-shadow: none; }

.v-check {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  border-radius: 2px;
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--v-blue);
  display: grid;
  place-items: center;
}
.v-select.selected .v-check { box-shadow: none; color: var(--v-blue); }
.v-select.selected .v-radio::after {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--v-blue);
}

.v-actions {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 10px;
}
.v-btn {
  height: 45px;
  border: 0;
  border-radius: 4px;
  font-family: var(--v-sans);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.2;
  cursor: pointer;
}
.v-btn.primary { background: var(--v-blue); color: #fff; }
.v-btn.secondary { background: transparent; color: var(--v-blue); box-shadow: inset 0 0 0 2px var(--v-blue); }

/* --- Confirmation panel --- */
.v-confirm { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.v-confirm-mark {
  align-self: center;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #D2E7D9;
  color: var(--v-black);
  display: grid;
  place-items: center;
}
.v-confirm-text { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.v-confirm-text h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; }
.v-confirm-text p { margin: 0; font-size: 16px; font-weight: 400; line-height: 1.2; color: var(--v-text-grey); }

/* --- Month picker and Slot picker (pp) --- */
.v-cal { background: #fff; border: 0.5px solid rgba(0,96,182,0.3); border-radius: 10px; overflow: hidden; }
.v-cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 10px;
  background: var(--v-blue);
  color: #fff;
}
.v-cal-head b { font-size: 18px; font-weight: 700; line-height: 1.2; }
.v-cal-nav {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  padding: 0;
  border: 0;
  background: none;
  color: #fff;
  cursor: pointer;
}
.v-cal-nav.off { opacity: 0.3; cursor: default; }
.v-cal-body { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.v-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 9px; }
.v-cal-dow { font-size: 12px; font-weight: 700; line-height: 1.2; text-align: center; color: #000; }
.v-cal-weeks { display: flex; flex-direction: column; gap: 10px; }

.v-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 43px;
  padding: 4px;
  border: 0;
  border-radius: 4px;
  background: var(--v-grey);
  font-family: var(--v-sans);
  font-size: 12px;
  line-height: 1.2;
  color: var(--v-blue);
}
.v-day.empty { background: transparent; }
.v-day.none { color: #A09F9B; }
.v-day .v-day-count {
  display: grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 9px;
  background: var(--v-blue);
  color: #fff;
  font-size: 12px;
  line-height: 1;
}
.v-day.free { cursor: pointer; }
.v-day.chosen { background: var(--v-blue); color: #fff; }
.v-day.chosen .v-day-count { background: #fff; color: var(--v-blue); }

.v-slots { display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 20px; }
.v-slots > b { font-size: 12px; font-weight: 700; line-height: 1.2; color: #000; }
.v-slot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  height: 30px;
  padding: 8px;
  border: 0;
  border-radius: 4px;
  background: var(--v-grey);
  color: var(--v-black);
  font-family: var(--v-sans);
  font-size: 12px;
  line-height: 1.2;
  cursor: pointer;
}
.v-slot.chosen { background: var(--v-blue); color: #fff; }

/* --- Result detail (4130:12166). Off-component, mocked. --- */
.v-legend { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; }
.v-legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--v-text-grey); }
.v-legend-dot { width: 12px; height: 12px; border-radius: 4px; background: #0F43CF; }
.v-legend-ends { display: flex; gap: 7px; }
.v-legend-ends i { display: block; width: 2px; height: 12px; background: #2D2B2B; }

.v-measure { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 8px; background: #fff; }
.v-measure-head { display: flex; flex-direction: column; gap: 4px; }
.v-measure-head > b { font-size: 16px; font-weight: 400; line-height: 1.2; }
.v-measure-val { display: flex; align-items: flex-end; gap: 4px; font-size: 12px; line-height: 1.2; }

.v-range-band { position: absolute; top: 26px; height: 4px; background: #C8D6FF; }
.v-range-end { position: absolute; top: 22px; width: 2px; height: 12px; background: #2D2B2B; box-shadow: 0 0 0 2px #fff; }

.v-measure-note { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--v-grey); }
.v-measure-note b { font-size: 12px; font-weight: 400; line-height: 1.2; }
.v-measure-note span { font-size: 12px; font-weight: 400; line-height: 1.2; color: var(--v-text-grey); }

.v-results-foot { padding: 0 12px; font-size: 12px; font-weight: 400; line-height: 1.3; color: var(--v-text-grey); }

/* --- Useful links tiles --- */
.v-tiles { display: flex; gap: 8px; }
.v-tile {
  flex: 1 1 0;
  min-width: 0;

  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--v-grey);
  color: var(--v-black);
}
.v-tile.horizontal {
  flex-direction: row;
  justify-content: center;
  padding: 10px;
}
.v-tile svg { color: var(--v-blue); }
.v-tile span { font-size: 12px; font-weight: 400; line-height: 1.2; text-align: center; }

/* --- Checklist item modal (4106:21225) --- */
.v-scrim {
  position: absolute;
  inset: 0;
  z-index: 15;
  background: rgba(13,13,13,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.v-modal {
  width: 100%;
  max-width: 343px;
  max-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding: 26px;
  border-radius: 8px;
  background: var(--v-cream);
  color: var(--v-black);
  overflow-y: auto;
  animation: modalIn 200ms cubic-bezier(0.22,1,0.36,1);
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .v-modal { animation: none; } }

.v-modal-body { display: flex; flex-direction: column; gap: 12px; }
.v-modal-head { display: flex; flex-direction: column; gap: 6px; }
.v-modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2; }
.v-modal-text { display: flex; flex-direction: column; gap: 6px; }
.v-modal-text p {
  margin: 0;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.17;
  color: var(--v-text-grey);
}
.v-modal-actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.v-modal-actions .v-btn { height: 39px; }

/* --- Checklist (To do list, pp) --- */
.v-todo-groups { display: flex; flex-direction: column; gap: 20px; }
.v-todo-group { display: flex; flex-direction: column; gap: 6px; }
.v-todo-group > h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.2; }
.v-todo-list { display: flex; flex-direction: column; gap: 6px; }
.v-todo-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 55px;
  padding: 10px 12px;
  border: 1px solid var(--v-grey);
  border-radius: 8px;
}
.v-todo-box {
  border: 0;
  padding: 0;
  cursor: pointer;
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  border-radius: 2px;
  box-shadow: inset 0 0 0 1px var(--v-blue);
  display: grid;
  place-items: center;
  color: transparent;
  transition: background 160ms ease, box-shadow 160ms ease;
}
.v-todo-box.done { background: var(--v-blue); box-shadow: none; color: #fff; }
.v-todo-box.done svg { animation: tickIn 220ms cubic-bezier(0.22,1,0.36,1); }
@keyframes tickIn { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }

.v-todo-row.settling { animation: settleOut 620ms ease forwards; }
@keyframes settleOut {
  0%, 55%   { opacity: 1; transform: none; }
  100%      { opacity: 0; transform: translateX(10px); }
}
.v-todo-row.landed { animation: landIn 420ms ease; }
@keyframes landIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .v-todo-box.done svg, .v-todo-row.settling, .v-todo-row.landed { animation: none; }
}
.v-todo-text { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; border: 0; background: none; padding: 0; font-family: var(--v-sans); color: inherit; text-align: left; cursor: pointer; }
.v-todo-text b { font-size: 14px; font-weight: 600; line-height: 1.2; }
.v-todo-text span { font-size: 12px; font-weight: 400; line-height: 1.2; color: var(--v-text-grey); }

/* --- Chat (side story). No Vision component for this yet. --- */
.v-chat-sheet {
  width: 100%;
  max-width: 343px;
  height: 78%;
  display: flex;
  flex-direction: column;
  border-radius: 20px 20px 0 0;
  background: #fff;
  color: var(--v-black);

  animation: sheetUp 240ms cubic-bezier(0.22,1,0.36,1);

.v-chat-head {
  flex: 0 0 auto;

  align-items: center;

  padding: 16px;

.v-chat-avatar {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(0,96,182,0.2);
  color: #fff;
  display: grid;
  place-items: center;
}
.v-chat-log {
  flex: 1 1 auto;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
}
.v-bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 16px;
  line-height: 1.25;
}
.v-bubble.them {
  align-self: flex-start;
  background: var(--v-grey);
  color: var(--v-black);
  border-bottom-left-radius: 4px;
}
.v-bubble.me {
  align-self: flex-end;
  background: var(--v-blue);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.v-chat-field {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 16px 16px;
  padding: 0 14px;
  height: 44px;
  border: 1px solid #C9C9CE;
  border-radius: 22px;
  font-size: 16px;
  color: #A09F9B;
}

/* --- Toolbar --- */
.v-toolbar-slot {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  padding: 10px 0;
}
.v-toolbar {
  width: 100%;
  display: flex;
  align-items: center;
  padding: 10px;
  border-radius: 20px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(18px) saturate(180%);

}
.v-tab[data-goto] { cursor: pointer; }
.v-tab[data-goto]:active { opacity: 0.6; }

.v-tab {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.v-tab > span:last-child {
  font-size: 10px;
  font-weight: 400;
  line-height: 1.2;
  color: var(--v-black);
  white-space: nowrap;
}

/* ---------------- presenter controls ---------------- */

.presenter-panel {
  position: absolute; inset: 0; z-index: 40;
  display: none; flex-direction: column;
  background: rgba(12,12,14,0.94);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  color: #fff;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px));
}
.presenter-panel.open { display: flex; }
.presenter-panel h2 {
  font-size: 13px; font-weight: 600; letter-spacing: 0.4px;
  text-transform: uppercase; opacity: 0.5; margin: 0 0 12px;
}
.presenter-steps { flex: 1 1 auto; overflow-y: auto; margin: 0 0 14px; }
.presenter-step {
  display: flex; gap: 10px; align-items: baseline; width: 100%;
  text-align: left; border: 0; background: none; color: #fff;
  font-family: var(--sf); font-size: 14px; line-height: 1.3;
  padding: 11px 10px; border-radius: 10px;
}
.presenter-step:hover { background: rgba(255,255,255,0.07); }
.presenter-step.current { background: rgba(255,255,255,0.15); }
.presenter-step .num { flex: 0 0 auto; width: 20px; opacity: 0.45; font-variant-numeric: tabular-nums; }
.presenter-step .kind {
  flex: 0 0 auto; font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase;
  opacity: 0.45; border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px; padding: 1px 5px;
}
.presenter-actions { flex: 0 0 auto; display: flex; gap: 8px; }
.presenter-actions button {
  flex: 1 1 0; border: 0; border-radius: 12px; padding: 13px 0;
  font-family: var(--sf); font-size: 14px; font-weight: 600;
  background: rgba(255,255,255,0.14); color: #fff;
}
.presenter-actions button.danger { background: #8e2b2b; }

</style>

<script>
window.addEventListener("error", function (e) {
  var box = document.createElement("div");
  box.className = "boot-error";
  box.textContent = (e.message || "Unknown error") +
    "\n\nat line " + (e.lineno || "?") + ", column " + (e.colno || "?") +
    "\n\n" + ((e.error && e.error.stack) || "no stack");
  var title = document.createElement("b");
  title.textContent = "The demo could not start";
  box.insertBefore(title, box.firstChild);
  document.body.appendChild(box);
});
</script>

<script>
(function () {
  "use strict";

  /* ================================================================
     SHARED DEMO DATA

    medication: "flecainide",

    {

    },

    },

      '<svg width="38" height="38" viewBox="0 0 38 38">' +
        '<defs><linearGradient id="msgGrad" x1="0" y1="0" x2="0" y2="1">' +

  function icon(name, size, weight) {
    return '<svg viewBox="0 0 20 20" width="' + size + '" height="' + size +
      '" fill="none" stroke="currentColor" stroke-width="' + (weight || 1) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICONS[name] + '</svg>';
  }

  var TABS = [
    { icon: "house",     label: "Home" },
    { icon: "calendar",  label: "Appointments" },
    { icon: "heartPulse", label: "My care" },
    { icon: "bookOpen",  label: "Resources" },
    { icon: "envelope",  label: "Messages" }
  ];

  /* Where the nav goes from here. Home lands on the most recent home
     screen, so it is always the right one for this point in the story.
     Tabs with nowhere to go stay inert rather than looking tappable. */
  var NAV = {};


  /* Where "now" is in the story. The nav pages are reached from anywhere,
     so they keep the position you came from rather than their own. */
  var storyAt = 0;
  function ord(id) { for (var i = 0; i < STEPS.length; i++) if (STEPS[i].id === id) return i; return -1; }
  function reached(id) { return id ? storyAt >= ord(id) : true; }
  function navFrom(index) {
    /* Sarah's phone is a different patient, so it never links into
       David's portal. */
    if (STEPS[index].sideStory) return {};
    /* Home is the portal as it stands now, not whichever home screen
       happened to be opened last. */
    var links = {};
    if (!STEPS[index].isHome) links.house = "home-booked";
    links.heartPulse = "my-care";
    links.calendar = "appointments";
    links.bookOpen = "resources";
    return links;
  }

  function toolbar(active, goesTo, links) {
    if (links === undefined) links = NAV;
    var html = '<div class="v-toolbar-slot"><div class="v-toolbar">';
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      var kind = t.icon === active ? "current" : "clear";
      var go = (goesTo && t.icon === goesTo) ? ' data-go="next"' : '';
      if (links && links[t.icon] && t.icon !== active) go = ' data-goto="' + links[t.icon] + '"';
      html += '<span class="v-tab"' + go + '>' +
        '<span class="v-iconbtn ' + kind + '">' + icon(t.icon, 28) + '</span>' +
        '<span>' + t.label + '</span></span>';
    }
    return html + '</div></div>';
  }

  /* Tag (pp vision): Warning and Error carry the Warning icon,
     Success carries Check. Both are drawn at 14px, stroke 0.9. */
  function tagIcon(kind) {
    if (kind === "success") return icon("check", 14, 1.3);
    if (kind === "warning" || kind === "error") {
      return '<svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" ' +
        'stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        ICONS.warning + '</svg>';
    }
    return "";
  }

  function tag(kind, label) {
    return '<span class="v-tag ' + kind + '">' + tagIcon(kind) +
      '<span>' + label + '</span></span>';
  }

  function visionCard(opts) {
    return '' +
      '<div class="v-card' + (opts.unread ? " unread" : "") + (opts.compact ? " compact" : "") + '"' +
        (opts.open ? ' data-goto="' + opts.open + '"' : "") + '>' +
        '<span class="v-card-stripe"></span>' +
        '<div class="v-card-body">' +
          (opts.icon ? '<span class="v-card-badge">' + icon(opts.icon, 22, 1.8) + '</span>' : "") +
          '<span class="v-card-text">' +
            (opts.tag
              ? '<span class="v-card-titlerow"><b>' + opts.title + '</b>' +
                  (typeof opts.tag === "string" ? tag("outline", opts.tag) : tag(opts.tag.kind, opts.tag.label)) +
                '</span>'
              : '<b>' + opts.title + '</b>') +
            '<span class="v-card-sub">' + opts.body + '</span>' +
          '</span>' +
        '</div>' +
      '</div>';
  }

  function apptCard(opts) {
    var a = DEMO.appointment;
    var o = opts || {};
    return '' +

    up.sort(function (x, y) { return apptWhen(x) - apptWhen(y); });

            '<p class="v-results-foot">These results have been shared with your care team. If you have any questions or concerns about your results, please contact your healthcare professional or the department that requested the test.</p>' +
          '</div>' +
        '</div>' +
        toolbar("heartPulse") +
        homeIndicator() +
      '</div>';
  }

  /* ================================================================
     RESOURCES
     What used to sit under My care: things to read, and ways to reach
     the team. Reached from the nav, so it follows the exploring rules.
     ================================================================ */

  var RESOURCE_PAGE = {
    /* His own, keyed to where his treatment has got to, newest first. */
    yours: [
      { from: "lock-accepted", icon: "clipboard", compact: true,
        title: "Living with atrial fibrillation",
        body: "What the condition means and how it is treated" },
      { from: "lock-appointment-booked", icon: "calendar", compact: true,
        title: "Preparing for your appointment",
        body: "What happens on the day, and what to bring with you" },
      { from: "lock-pre-op-form", icon: "heartPulse", compact: true,
        title: "About your " + DEMO.procedure,
        body: "How the procedure works and what to expect afterwards" },
      { from: "lock-pifu-discharge", icon: "heartPulse", compact: true,
        title: "Recovering from your procedure",
        body: "What to expect in the weeks and months afterwards" },
      { from: "lock-pifu-discharge", icon: "bookOpen", compact: true,
        title: "Looking after your heart",
        body: "Staying active, eating well and keeping to your medicines" }
    ],
    /* The same for everyone, whatever they are being seen for. */
    general: [
      { icon: "heartPulse", compact: true, title: "Wellbeing support",
        body: "Get support and advice to feel your best" },
      { icon: "bookOpen", compact: true, title: "Mental health support",
        body: "New wellbeing resources now available" },
      { icon: "question", compact: true, title: "Using this portal",
        body: "How to book, reschedule and get in touch with your team" }
    ],
  };

  var HELP_TILES = [
    ["question", "FAQs"],
    ["phone", "Contact us"],
    ["settings", "Accessibility"]
  ];

  /* Ways to reach the team, shown on the home screen while he is waiting
     for something rather than on the reading list. */
  var CONTACT_TILES = [
    ["calendar", "Request an appointment"],
    ["heartPulse", "Report a symptom change"]
  ];

  function contactTiles() {
    var tiles = "";
    for (var t = 0; t < CONTACT_TILES.length; t++) tiles += tile(CONTACT_TILES[t][0], CONTACT_TILES[t][1]);
    return '<div class="v-tiles">' + tiles + '</div>';

  function stepResources() {
    var yours = "";
    for (var i = RESOURCE_PAGE.yours.length - 1; i >= 0; i--) {
      var r = RESOURCE_PAGE.yours[i];
      if (reached(r.from)) yours += visionCard(r);
    }
    var general = "";
    for (var g = 0; g < RESOURCE_PAGE.general.length; g++) general += visionCard(RESOURCE_PAGE.general[g]);
    var help = "";
    for (var hT = 0; hT < HELP_TILES.length; hT++) help += tile(HELP_TILES[hT][0], HELP_TILES[hT][1]);
    return '' +
      '<div class="surface vision">' +
        statusBar(DEMO.timeline.appointmentBooked.time) +
        '<div class="v-main">' +
          actionBar("name", { title: "Resources" }) +
          (yours ? myCareSection("Your resources", yours) : "") +
          myCareSection("General resources", general) +
          myCareSection("Help", '<div class="v-tiles">' + help + '</div>') +

        toolbar("bookOpen") +
        homeIndicator() +
      '</div>';
  }

  /* ================================================================
     THE SPINE
     kind: "beat"        tap anywhere advances
           "interactive" taps do real things; advances on completion,
                         with the Next escape hatch always available
     ================================================================ */

  var STEPS = [
    { id: "lock-quiet-quietopen", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, the story opens", render: stepLockQuiet("quietOpen") },
    { id: "lock-referral",   kind: "beat", tone: "dark",  slide: 3, frame: "66",
      label: "Lock screen: referral being reviewed", render: stepLock("referral-reviewed") },
    { id: "lock-quiet-quietpreaccepted", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, eight days on", render: stepLockQuiet("quietPreAccepted") },
    { id: "lock-accepted", kind: "interactive", tone: "dark", slide: 7, frame: "67",
      label: "Lock screen: referral accepted, portal link", render: stepLock("referral-accepted", true) },
    { id: "home-useful-links", isHome: true, kind: "beat", tone: "light", slide: 7, frame: "3916:30065",
      label: "Portal home: welcome update", clock: "portalFirstVisit", render: stepHome },
    { id: "my-care", navPage: true, kind: "beat", tone: "light", slide: null, frame: "4106:19841",
      label: "My care: treatment, resources, get in touch", render: stepMyCare },
    { id: "lock-quiet-quietwait", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,

    { id: "lock-waiting-well", kind: "interactive", tone: "dark", slide: null, frame: null,

    { id: "form-waiting-well", kind: "interactive", tone: "light", slide: 8, frame: "3912:29756",
      form: "waiting-well", label: "Waiting well form: three questions", render: stepForm("waiting-well") },
    { id: "form-submitted", kind: "beat", tone: "light", slide: 8, frame: "3928:30838",
      label: "Form submitted confirmation", render: stepFormSubmitted },
    { id: "lock-quiet-quietpreinvite", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, six days on", render: stepLockQuiet("quietPreInvite") },
    { id: "lock-booking-invite", kind: "beat", tone: "dark", slide: 11, frame: null,
      label: "Lock screen: invite to book (ignored)", render: stepLock("booking-invite") },
    { id: "lock-quiet-quietprebooking", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, three days on", render: stepLockQuiet("quietPreBooking") },
    { id: "lock-appointment-booked", kind: "interactive", tone: "dark", slide: 13, frame: null,
      label: "Lock screen: appointment booked", render: stepLock("appointment-booked", true), opens: "home-booked" },
    { id: "home-booked", navPage: true, isHome: true, kind: "beat", tone: "light", slide: 13, frame: "4106:19798",
      label: "Portal home: the appointment has just landed", clock: "appointmentBooked", render: stepHome },
    { id: "lock-quiet-quietevening", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, later that evening", render: stepLockQuiet("quietEvening") },
    { id: "lock-questionnaire", kind: "interactive", tone: "dark", slide: 14, frame: null,
      label: "Lock screen: pre-appointment questionnaire", render: stepLock("questionnaire", true), opens: "form-questionnaire" },
    { id: "form-questionnaire", navPage: true, form: "questionnaire", kind: "interactive", tone: "light", slide: 14, frame: null,
      label: "Pre-appointment questionnaire: three questions", render: stepForm("questionnaire") },
    { id: "result-detail", navPage: true, kind: "beat", tone: "light", slide: null, frame: "4130:12166",
      label: "Result: full blood count panel", render: stepResult },
    { id: "resources", navPage: true, kind: "beat", tone: "light", slide: null, frame: null,
      label: "Resources: things to read and ways to get in touch", render: stepResources },
    { id: "appointments", navPage: true, kind: "beat", tone: "light", slide: null, frame: "4130:11867",
      label: "Appointments: upcoming and previous", render: stepAppointments },
    { id: "lock-quiet-quietpretests", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, three weeks on", render: stepLockQuiet("quietPreTests") },
    { id: "lock-tests-reminder", kind: "interactive", tone: "dark", slide: 10, frame: null,
      label: "Lock screen: book bloods and ECG", render: stepLock("tests-reminder", true) },
    { id: "booking-date", kind: "interactive", tone: "light", slide: 10, frame: "3939:32249",
      label: "Book a blood test: choose a date", render: stepBloodTestBooking },
    { id: "booking-slot", kind: "interactive", tone: "light", slide: 10, frame: "3939:32530",
      label: "Book a blood test: choose a time", render: stepSlotPicker },
    { id: "booking-confirm", kind: "interactive", tone: "light", slide: 10, frame: "3945:33080",
      label: "Book a blood test: confirm", render: stepBookingConfirm },
    { id: "booking-booked", kind: "beat", tone: "light", slide: 10, frame: "3945:33175",
      label: "Blood test booked confirmation", render: stepBookingBooked },
    { id: "lock-quiet-appointment-day", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, morning of the appointment", render: stepLockQuiet("appointmentDay") },
    { id: "lock-pre-op-form", kind: "interactive", tone: "dark", slide: 18, frame: null,
      label: "Lock screen: pre-op assessment to complete", render: stepLock("pre-op-form", true), opens: "form-pre-op" },
    { id: "form-pre-op", navPage: true, form: "pre-op", kind: "interactive", tone: "light", slide: 18, frame: null,
      label: "Pre-op assessment: three questions", render: stepForm("pre-op") },
    { id: "lock-quiet-quietpremeds", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, three weeks on", render: stepLockQuiet("quietPreMeds") },
    { id: "lock-meds-reminder", kind: "interactive", tone: "dark", slide: 21, frame: null,
      label: "Lock screen: stop your medication", render: stepLock("meds-reminder", true) },
    { id: "pre-op-checklist", kind: "beat", tone: "light", slide: 21, frame: "3961:34125",
      label: "Pre-op checklist", render: stepPreOpChecklist },
    { id: "lock-quiet-quietsurgeryday", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, the morning of surgery", render: stepLockQuiet("quietSurgeryDay") },
    { id: "lock-pifu-discharge", kind: "interactive", tone: "dark", slide: 22, frame: null,
      label: "Lock screen: discharged to PIFU", render: stepLock("pifu-discharge", true), opens: "home-booked" },
    { id: "lock-quiet-quietthreemonths", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, three months on", render: stepLockQuiet("quietThreeMonths") },
    { id: "lock-three-month-form", kind: "interactive", tone: "dark", slide: 24, frame: null,
      label: "Lock screen: three-month form sent automatically", render: stepLock("three-month-form", true), opens: "pifu-form" },
    { id: "pifu-form", navPage: true, form: "three-month", kind: "interactive", tone: "light", slide: 24, frame: "3970:47581",
      label: "Three-month check: three questions", render: stepForm("three-month") },
    { id: "lock-quiet-quietafterpifu", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, two weeks on", render: stepLockQuiet("quietAfterPifu") },
    { id: "lock-discharged", kind: "interactive", tone: "dark", slide: 26, frame: null,
      label: "Lock screen: discharged, contact your GP", render: stepLock("discharged", true) },
    { id: "home-resources", isHome: true, kind: "beat", tone: "light", slide: 26, frame: "3970:47654",
      label: "Portal home: helpful resources", clock: "homeResources", render: stepHome },
    { id: "lock-quiet-quietbeforesarah", stage: true, kind: "beat", tone: "dark", slide: null, frame: null,
      label: "Lock screen: quiet, before the side story", render: stepLockQuiet("quietBeforeSarah", "warm") },
    { id: "sarah-chat", sideStory: true, kind: "beat", tone: "light", slide: null, frame: null,
      label: "Side story: Sarah, moving to adult services", render: stepSarahChat }
  ];

  /* ================================================================
     ENGINE
     ================================================================ */

  var stage = document.getElementById("stage");
  var device = document.getElementById("device");
  var stepNumber = document.getElementById("stepNumber");
  var navPill = document.getElementById("navPill");
  var panel = document.getElementById("presenterPanel");
  var panelSteps = document.getElementById("presenterSteps");
  var index = 0;

  function current() { return STEPS[index]; }

  function render() {
    var step = current();
    stage.innerHTML = step.render();

    device.classList.toggle("tone-dark", step.tone === "dark");
    device.classList.toggle("tone-light", step.tone !== "dark");

    var kind = (step.form && formState(step.form).done && !FORMS[step.form].separateConfirm)
      ? "beat" : step.kind;
    navPill.classList.toggle("show", kind === "beat" &&
      seqAfter(step.navPage ? storyAt : index) > -1);

    var seqTotal = 0, seqPos = 0;
    var mark = step.navPage ? storyAt : index;
    for (var q = 0; q < STEPS.length; q++) {
      if (STEPS[q].navPage) continue;
      seqTotal++;
      if (q <= mark) seqPos = seqTotal;
    }
    stepNumber.innerHTML = step.navPage
      ? "<b>Exploring from screen " + seqPos + "</b> &nbsp;&middot;&nbsp; " + step.label
      : "<b>Screen " + seqPos + "</b> of " + seqTotal + " &nbsp;&middot;&nbsp; " + step.label;

    paintPanel();
  }

  function goTo(i) {
    /* Opening a form starts it at question one. Moving within a form
       re-renders rather than calling goTo, so this does not disturb it. */
    if (i >= 0 && i < STEPS.length && STEPS[i].form && i !== index) delete FORM_STATE[STEPS[i].form];
    if (i >= 0 && i < STEPS.length && !STEPS[i].navPage) storyAt = i;
    NAV = navFrom(i);
    if (i < 0 || i >= STEPS.length) return;
    index = i;
    render();
  }

  /* My care and Appointments are explored from the nav, so Next and Back
     step over them. They keep their place in STEPS so the nav can reach
     them and the presenter panel can jump to them. */
  function seqAfter(i)  { for (var j = i + 1; j < STEPS.length; j++) if (!STEPS[j].navPage) return j; return -1; }
  function seqBefore(i) { for (var j = i - 1; j >= 0; j--) if (!STEPS[j].navPage) return j; return -1; }
  /* Exploring never moves the story: whichever portal page you are on,
     Next picks the story up from the screen you wandered off from. */
  function next() { var j = seqAfter(STEPS[index].navPage ? storyAt : index); if (j > -1) goTo(j); }
  function prev() { var j = seqBefore(STEPS[index].navPage ? storyAt : index); if (j > -1) goTo(j); }

  function reset() {
    index = 0;
    resetForm();
    storyAt = 0;
    MYCARE.tab = 0;
    resetBooking();
    resetChecklist();
    closePanel();
    render();
  }

  /* --- interactive step controls --- */

  stage.addEventListener("click", function (e) {
    if (suppressClick) { suppressClick = false; return; }
    var day = e.target.closest("[data-day]");
    if (day) {
      e.stopPropagation();
      var picked = parseInt(day.getAttribute("data-day"), 10);
      if (!BOOKING.chosen || BOOKING.chosen.day !== picked || BOOKING.chosen.month !== BOOKING.shown) {
        BOOKING.slot = null;
      }
      BOOKING.chosen = { month: BOOKING.shown, day: picked };
      render();
      return;
    }

    var tab = e.target.closest("[data-tab]");
    if (tab) {
      e.stopPropagation();
      MYCARE.tab = parseInt(tab.getAttribute("data-tab"), 10);
      render();
      return;
    }

    var jump = e.target.closest("[data-goto]");
    if (jump) {
      e.stopPropagation();
      var target = jump.getAttribute("data-goto");
      for (var g = 0; g < STEPS.length; g++) {
        if (STEPS[g].id === target) {
          goTo(g);
          return;
        }
      }
      return;
    }

    var tick = e.target.closest("[data-tick]");
    if (tick) {
      e.stopPropagation();
      var tid = tick.getAttribute("data-tick");
      if (CHECKLIST.checked[tid]) {
        CHECKLIST.checked[tid] = false;
        CHECKLIST.landed = null;
        render();
      } else if (!CHECKLIST.settling) {
        /* show the tick where it is, then let the row move across */
        CHECKLIST.settling = tid;
        render();
        setTimeout(function () {
          CHECKLIST.settling = null;
          CHECKLIST.checked[tid] = true;
          CHECKLIST.landed = tid;
          render();
        }, 620);
      }
      return;
    }

    var opener = e.target.closest("[data-open]");
    if (opener) {
      e.stopPropagation();
      CHECKLIST.open = opener.getAttribute("data-open");
      render();
      return;
    }

    var sheet = e.target.closest("[data-sheet]");
    if (sheet) {
      e.stopPropagation();
      var which = sheet.getAttribute("data-sheet");
      var openId = CHECKLIST.open;
      CHECKLIST.open = null;
      if (which === "done" && openId && !CHECKLIST.checked[openId] && !CHECKLIST.settling) {
        CHECKLIST.settling = openId;
        render();
        setTimeout(function () {
          CHECKLIST.settling = null;
          CHECKLIST.checked[openId] = true;
          CHECKLIST.landed = openId;
          render();
        }, 620);
      } else {
        render();
      }
      return;
    }

    var mnav = e.target.closest("[data-month]");
    if (mnav) {
      e.stopPropagation();
      BOOKING.shown += (mnav.getAttribute("data-month") === "next") ? 1 : -1;
      if (BOOKING.shown < 0) BOOKING.shown = 0;
      if (BOOKING.shown > BOOKING.months.length - 1) BOOKING.shown = BOOKING.months.length - 1;
      render();
      return;
    }

    var slot = e.target.closest("[data-slot]");
    if (slot) {
      e.stopPropagation();
      BOOKING.slot = parseInt(slot.getAttribute("data-slot"), 10);
      render();
      return;
    }

    var opt = e.target.closest("[data-opt]");
    if (opt) {
      e.stopPropagation();
      var fs = formState(STEPS[index].form);
      var fq = FORMS[STEPS[index].form].questions[fs.index];
      var pick = parseInt(opt.getAttribute("data-opt"), 10);
      if (fq.multi) {
        var set = fs.answers[fs.index] || [];
        var at = set.indexOf(pick);
        if (at > -1) set.splice(at, 1); else set.push(pick);
        fs.answers[fs.index] = set;
      } else {
        fs.answers[fs.index] = pick;
      }
      render();
      return;
    }
    var go = e.target.closest("[data-go]");
    if (go) {
      e.stopPropagation();
      if (go.getAttribute("data-go") === "next") {
        var opens = STEPS[index].opens;
        if (opens) { for (var o = 0; o < STEPS.length; o++) if (STEPS[o].id === opens) { goTo(o); return; } }
        next();
      } else prev();
      return;
    }

    var act = e.target.closest("[data-form]");
    if (!act) return;
    e.stopPropagation();
    var what = act.getAttribute("data-form");
    var fid = STEPS[index].form;
    if (!fid) return;
    var f = FORMS[fid], st = formState(fid), total = f.questions.length;

    if (what === "continue") {
      if (st.index < total - 1) { st.index++; render(); }
      else if (f.separateConfirm) { next(); }
      else { st.done = true; render(); }
    } else if (what === "back") {
      if (st.done) { st.done = false; render(); }
      else if (st.index > 0) { st.index--; render(); }
      else { prev(); }
    }
  });

  /* --- advancing --- */

  document.getElementById("device").addEventListener("click", function (e) {
    if (suppressClick) { suppressClick = false; return; }
    if (panel.classList.contains("open")) return;
    /* Nothing advances on a stray tap any more. Beats move on only
       via the Next control; interactive steps only via their own
       controls. This keeps a demo from jumping under your thumb. */
  });

  function bindNav(el) {
    el.addEventListener("click", function (e) {
      e.stopPropagation();
      if (el.disabled) return;
      if (el.getAttribute("data-nav") === "next") next(); else prev();
    });
  }
  bindNav(navPill);

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " ") { next(); }
    else if (e.key === "ArrowLeft") { prev(); }
    else if (e.key === "Escape") { closePanel(); }
  });

  /* Swipe right to go back. No visible control, and a vertical guard so
     scrolling a long screen is never mistaken for a swipe. */
  var touchX = null, touchY = null;
  document.addEventListener("touchstart", function (e) {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    if (dx > 70 && Math.abs(dy) < 50) prev();
  }, { passive: true });

  /* --- presenter panel, behind a long press --- */

  var pressTimer = null;
  var suppressClick = false;
  var CORNER = 68;

  function inCorner(e) {
    var r = device.getBoundingClientRect();
    return (e.clientX - r.left) < CORNER && (r.bottom - e.clientY) < CORNER;
  }
  function cancelPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  }

  device.addEventListener("pointerdown", function (e) {
    if (panel.classList.contains("open") || !inCorner(e)) return;
    cancelPress();
    pressTimer = setTimeout(function () {
      pressTimer = null;
      suppressClick = true;
      openPanel();
    }, 650);
  });
  device.addEventListener("pointerup", cancelPress);
  device.addEventListener("pointerleave", cancelPress);
  device.addEventListener("pointercancel", cancelPress);

  function openPanel() { panel.classList.add("open"); paintPanel(); }
  function closePanel() { panel.classList.remove("open"); }

  function seqNo(i) { var n = 0; for (var q = 0; q <= i; q++) if (!STEPS[q].navPage) n++; return n; }

  function paintPanel() {
    panelSteps.innerHTML = "";
    for (var i = 0; i < STEPS.length; i++) {
      var s = STEPS[i];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "presenter-step" + (i === index ? " current" : "");
      b.setAttribute("data-index", String(i));
      b.innerHTML = '<span class="num">' + (s.navPage ? "&middot;" : seqNo(i)) + '</span>' +
                    '<span class="lbl">' + s.label + '</span>' +
                    '<span class="kind">' + (s.navPage ? "nav" : s.kind) + '</span>';
      panelSteps.appendChild(b);
    }
  }

  panelSteps.addEventListener("click", function (e) {
    var btn = e.target.closest(".presenter-step");
    if (!btn) return;
    e.stopPropagation();
    goTo(parseInt(btn.getAttribute("data-index"), 10));
    closePanel();
  });

  document.getElementById("btnClose").addEventListener("click", function (e) {
    e.stopPropagation();
    closePanel();
  });
  document.getElementById("btnReset").addEventListener("click", function (e) {
    e.stopPropagation();
    reset();
  });
  panel.addEventListener("click", function (e) { e.stopPropagation(); });

  render();

  /* exposed for the test harness */
  window.__demo = {
    goTo: goTo, next: next, prev: prev, reset: reset,
    steps: STEPS, data: DEMO, forms: FORMS, updatesSection: updatesSection,
    at: function () { return index; }
  };
})();

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Ask search engines not to list this site. -->
<meta name="robots" content="noindex, nofollow">
<title>Simulator demos</title>
<style>
  :root {
    --bg: #F9F8F6;
    --card: #FFFFFF;
    --text: #0D0D0D;
    --muted: #767676;
    --accent: #0060B6;
    --border: #ECECEC;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --card: #1E1E21;
      --text: #F2F2F2;
      --muted: #A0A0A6;
      --accent: #6AAEF0;
      --border: #2C2C30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  a.demo {
    display: block;
    padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
  }
  a.demo:hover, a.demo:focus-visible { border-color: var(--accent); }
  a.demo b { display: block; color: var(--accent); font-size: 17px; }
  a.demo span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Simulator demos</h1>
  <p class="intro">Choose a demo to open it. All data in these demos is made up.</p>
  <ul>
    <li>
      <a class="demo" href="tce-mobile-demo-v1/">
        <b>tce-mobile-demo-v1</b>
        <span>TCE 2026: David's journey (mobile)</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
